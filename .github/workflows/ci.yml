name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    # Lint, static analysis and the unit suite; none of it boots WordPress.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer stan

      - name: Unit tests
        run: composer test

  build:
    runs-on: ubuntu-latest
    # The committed build/ must match the sources, and stay under budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:js

      - name: Types
        run: pnpm lint:types

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build is committed
        run: git diff --exit-code build/

      # dataviews' /wp entry inlines its own @wordpress/components (with
      # date-fns, react-day-picker, @base-ui, ariakit, framer-motion), which is
      # ~1.95 MB of the 2.1 MB (420 KB gzipped); the plugin's own code is
      # ~100 KB minified. edit/ and history/ are already lazy chunks. Raise
      # only with a note of what grew.
      - name: Size budget
        run: |
          size=$(wc -c < build/index.js)
          echo "build/index.js: $size bytes"
          test "$size" -le 2306867

  integration:
    runs-on: ubuntu-latest
    # Boots WordPress and WooCommerce in wp-env. Blocking: the suite is
    # the only check of the REST hooks the plugin is built on.
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: composer install --no-interaction --prefer-dist

      - run: pnpm install --frozen-lockfile

      - run: pnpm env:start

      - run: composer test:wp-env
